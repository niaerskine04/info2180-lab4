<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Superhero Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>The Superhero Search</h1>
    </header>
    <main>
        <section class="search-section">

        <section id="result">

    </main>
    <footer>
        <p>&copy; 2025 The Superhero Search</p>
    </footer>
    <script src="app.js"></script>
</html>
